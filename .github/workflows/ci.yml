name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 300s ./...
      - name: Build the CLI
        run: go build -trimpath -o /tmp/queuesim ./cmd/queuesim && /tmp/queuesim list >/dev/null
